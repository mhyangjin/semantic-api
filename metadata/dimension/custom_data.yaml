dimension_id: custom_data
business_name: 커스텀 데이터
description: >
  사용자 정의 Key/Value 데이터를 조회한다.

parameters:
  - name: key
    business_name: Key
    required: true
  - name: value
    business_name: Value
    required: true

mappings:
  - table: notification_index
    column: index
    pattern:
      format: "{key}:{value}"

joins:
  - notification
  - notification_status
  - notification_channels
  - recipient