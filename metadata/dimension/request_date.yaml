dimension_id: request_date
business_name: 발송 일자
description: >
  한국시간(KST) 기준 발송 요청 날짜.
  notification.request_kst_date의 물리 타입은 string이며 값 형식은 YYYY-MM-DD이다.
  Athena에서 상대 날짜와 비교할 때 date_format을 사용하지 않는다.
  먼저 CAST(current_timestamp AT TIME ZONE 'Asia/Seoul' AS date)로 KST 날짜를
  구하고 date_add를 적용한 뒤, 최종 날짜를 CAST(... AS varchar)로 변환하여
  request_kst_date와 문자열로 비교한다.

mappings:
  - table: notification
    column: request_kst_date

joins:
  - notification_status
