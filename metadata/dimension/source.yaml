dimension_id: source
business_name: 발신지
literal_patterns:
  - regex: '(?:^|\s)(?:발신지|발송지)(?:\s*(?:ID|아이디))?\s+([A-Za-z0-9_.:#-]+)'

mappings:
  - table: notification_index
    column: index
    pattern:
      prefix: "SOURCE:"
      extract: suffix

joins:
  - notification
  - notification_status
  - notification_channels
  - recipient
