version: 1.0
dimensions:
  - term: 고객
    dimension: customer
    aliases:
      - 고객ID
      - 고객번호
      - 고객 번호
      - 수신 고객
      - 고객별
      - 사용자
    description: >
      메시지를 수신한 고객

  - term: 채널
    dimension: channel
    aliases:
      - 발송 채널
      - 메시지 채널
      - SMS
      - LMS
      - MMS
      - 알림톡
      - 친구톡
      - 이메일
      - Email
      - Push
      - PUSH
    description: >
      메시지가 발송된 채널
    values:
        SMS:
          - sms
        LMS:
          - lms
        MMS:
          - mms
        KAKAO_ALIMTALK:
          - 알림톡
          - 알림 톡
        KAKAO_FRIENDTALK:
          - 친구톡
        EMAIL:
          - 이메일
          - email
        PUSH:
          - 푸시
          - Push

  - term: 이벤트
    dimension: event
    aliases:
      - 이벤트ID
      - 캠페인
      - 캠페인ID
      - 이벤트별
    description: >
      메시지가 속한 이벤트

  - term: 서비스
    dimension: service
    aliases:
      - 서비스ID
      - 서비스별
    description: >
      메시지가 속한 서비스

  - term: 워크스페이스
    dimension: workspace
    aliases:
      - Workspace
      - 작업공간
    description: >
      워크스페이스

  - term: 조직
    dimension: organization
    aliases:
      - Organization
      - 조직별
    description: >
      조직

  - term: 발송일
    dimension: request_date
    aliases:
      - 요청일
      - 발송 날짜
      - 날짜
      - 일자
      - 요청일자
    description: >
      메시지 발송 요청일(KST)

  - term: 메시지 유형
    dimension: notification_type
    aliases:
      - Notification Type
      - 타입
      - 알림 유형
      - 메시지 타입
    description: >
      Notification Type

  - term: 결과
    dimension: result
    aliases:
      - 발송 결과
      - 성공 여부
      - 처리 결과
    description: >
      SUCCESS / FAIL 등의 발송 결과

  - term: 상태
    dimension: status
    aliases:
      - 처리 상태
      - 발송 상태
    description: >
      REQUEST, SEND, DELIVER 등의 상태
