version: 1.0

metrics:
  - term: 발송 건수
    metric: request_count
    aliases:
      - 요청 건수
      - 발송 요청 건수
      - 발송량
      - 메시지 발송 건수
    description: >
      발송 요청된 메시지의 개수

  - term: 발송 성공 건수
    metric: send_success_count
    aliases:
      - 성공 건수
      - 성공 발송 건수
      - 성공 메시지 수
    description: >
      성공적으로 발송된 메시지 개수

  - term: 발송 실패 건수
    metric: send_fail_count
    aliases:
      - 실패 건수
      - 실패 발송 건수
    description: >
      발송 실패한 메시지 개수

  - term: 요청 실패 건수
    metric: request_fail_count
    aliases:
      - 요청 실패 건수
      - 요청 실패 발송 건수
      - 발송 요청 실패 건수
    description: >
      발송 실패한 메시지 개수

  - term: 발송 성공률
    metric: delivery_rate
    aliases:
      - 성공률
      - Delivery Rate
    description: >
      발송 요청 대비 성공적으로 발송된 비율

  - term: 오픈율
    metric: open_rate
    aliases:
      - 읽음률
      - Open Rate
    description: >
      성공적으로 발송된 메시지 중 읽은 비율