metric_name: request_count
business_name: 발송 요청 건수
description: >
  발송 요청된 전체 건수

aggregate: count
table: notification_status
filter:
  - column: status
    operator: "="
    value: REQUEST
  - column: result
    operator: "="
    value: SUCCESS
supported_dimensions:
  - request_date
  - customer
  - notification_type
  - channel
default_dimension:
  - request_date