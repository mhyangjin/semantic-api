table_name: inbox
business_name: 인박스
description: >
    고객별 발송 요청의 읽음 여부를 조회하기 위한 테이블

owner: Sendy
refresh_cycle: hourly

joins:
  - table: notification
    type: inner
    purpose: 발송 요청의 읽음 여부를 조회
    join_cardinality: many_to_one
    conditions:
    - left: notification_id
      operator: "="
      right: notification_id
      required: true

columns:
  - name: customer_id
    business_name: 고객번호
    type: string
    description: >
      고객번호를 base64로 디코딩한 값이다.

  - name: notification_id
    business_name: 발송 요청 ID
    type: string
    description: 발송 요청의 고유 식별자

  - name: channel_id
    business_name: 발송 채널 ID
    type: string

  - name : custom_message_id
    business_name: 고객 메시지 ID
    type: string
    description: >
      발송 요청에 대한 수신자 단위의 고유 식별자
      수신자 번호를 base64로 디코딩 한 후 '.'을 붙이고,뒤에 uuid를 붙여서 고객 메시지 ID를 생성한다.

  - name: is_open
    business_name: 읽음 여부
    type: string
    description: >
      고객이 메세지를 읽은 경우 'Y'
      읽지 않은 경우 'N' 또는 Null