table_name: notification_index
business_name: 발송 구분 인덱스

description: >
  여러가지 인덱스 조건에 따라
  notification_id를 빠르게 조회하기 위한 역색인 테이블

owner: Sendy
refresh_cycle: hourly

joins:
  - table: notification
    type: inner
    purpose: 발송 내역을 조회
    join_cardinality: many_to_one
    conditions:
      - left: notification_id
        operator: "="
        right: notification_id
        required: true

columns:
  - name: index
    business_name: 인덱스 키
    type: string
    description: >
      이벤트별 조회일 경우 이벤트 ID 앞에 EVENT#을 붙인다.
      채널별 조회일 경우 채널 ID 앞에 CH#을 붙인다.
      조직별 조회일 경우 조직 ID 앞에 OR#을 붙인다.
      워크스페이스별 조회일 경우 워크스페이스 ID 앞에 WS#을 붙인다.
      템플릿별 조회일 경우 템플릿 ID 앞에 TEMP#을 붙인다.
      JOB별 조회일 경우 JOB ID 앞에 JOB#을 붙인다.
      발송지역별 조회일 경우 발송지 구분자 앞에 SOURCE:을 붙인다.
      custom data별 조회일 경우 custom data field명:value 를 붙인다.

  - name: notification_id
    business_name: 발송 요청 ID
    type: string
    description: 발송 요청의 고유 식별자

  - name: occurred_at
    business_name: 발생 시각
    type: string
    description: 발송 요청이 발생한 UTC 기준 시각
