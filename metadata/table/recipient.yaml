table_name: recipient
business_name: 발송 수신자

description: >
  발송 대상 고객 정보를 저장한다.
owner: Sendy
refresh_cycle: hourly

joins:
  - table: notification
    type: inner
    purpose: 수신인 정보로 발송 정보를 조회
    join_cardinality: many_to_one
    entity_cardinality: many_to_many
    conditions:
      - left: notification_id
        operator: "="
        right: notification_id
        required: true

  - table: notification_status
    type: inner
    purpose: 수신인 정보로 발송 결과를 조회
    join_cardinality: one_to_many
    conditions:
      - left: notification_id
        operator: "="
        right: notification_id
        required: true

columns:
  - name: recipient_id
    business_name: 수신자 번호
    description: >
      수신자 번호가 전화번호이면 PH#으로 시작, 
      수신자 번호가 이메일이면 EM#으로 시작
      수신자 번호가 고객번호이면 CU#으로 시작

  - name: notification_id
    business_name: 발송 요청 ID

  - name: custom_message_id
    business_name: 고객 메시지 ID
    description: >
        발송 요청에 대한 수신자 단위의 고유 식별자
        수신자 번호를 base64로 인코딩 한 후 '.'을 붙이고,뒤에 uuid를 붙여서 고객 메시지 ID를 생성한다.

  - name: channel_id
    business_name: 발송 채널 ID

  - name: notification_type
    business_name: 발송 유형
    enum:
      ad: 광고성
      info: 정보성

  - name: organization_id
    business_name: 조직 ID

  - name: service_id
    business_name: 서비스 ID

  - name: workspace_id
    business_name: 워크스페이스 ID