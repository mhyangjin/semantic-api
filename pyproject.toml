[project]
name = "semantic-api"
version = "0.1.0"
description = ""
authors = [{ name = "mhjin", email = "julu1@naver.com" }]
requires-python = ">=3.12.1,<3.15"
dependencies = [
    "fastapi>=0.108.0,<1.0.0",
    "uvicorn>=0.25.0,<1.0.0",
    "logger>=1.4",
    "colorlog>=6.8.0,<7.0.0",
    "json-log-formatter>=0.5.2,<1.0.0",
    "aenum>=3.1.15,<4.0.0",
    "pydantic>=2.6.1,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "httpx>=0.26.0,<1.0.0",
    "pytz>=2023.3.post1",
    "typing-extensions>=4.9.0,<5.0.0",
    "python-multipart>=0.0.6",
    "pyjwt>=2.8.0,<3.0.0",
    "lxml>=4.6.5,!=4.7.0",
    "isodate>=0.6.1",
    "setuptools>=69.1.0",
    "uuid6>=2024.7.10",
    "sqlalchemy>=2.0.41,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "psycopg2>=2.9.10,<3.0.0",
    "aiohttp>=3.12.14,<4.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "urllib3 (>=2.7.0,<3.0.0)",
    "fastmcp (>=3.4.5,<4.0.0)",
    "trio>=0.32.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4,<8.0.0",
    "pytest-cov>=2.10.1",
]

[tool.poetry]
package-mode = false

[tool.uv]
package = false

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
